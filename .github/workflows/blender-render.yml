name: Blender Cinematic Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Pilih komposisi video yang ingin dirender'
        required: true
        default: 'cinematic-hourglass'
        type: choice
        options:
          - cinematic-hourglass
          - particles-gold
          - abstract-wave
          - neon-rings
      frames:
        description: 'Number of frames to render (max 720 for full 12s)'
        required: false
        default: '720'
      resolution:
        description: 'Resolution: 1080 or 4K'
        required: false
        default: '1080'
        type: choice
        options:
          - 1080
          - 4K

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Create output directory
        run: mkdir -p output

      - name: Select composition script
        run: |
          COMPOSITION="${{ github.event.inputs.composition }}"
          echo "Selected composition: $COMPOSITION"
          echo "SCRIPT=cinematic_hourglass.py" >> $GITHUB_ENV
          echo "OUTPUT_NAME=$COMPOSITION" >> $GITHUB_ENV

      - name: Run Blender render
        run: |
          blender --background --python "${{ env.SCRIPT }}"
          echo "Listing output directory:"
          ls -la output/
          echo "Checking for rendered frames:"
          ls -la output/frame_*.png || echo "No frames found!"

      - name: Encode video with FFmpeg
        run: |
          ls -la output/
          ffmpeg -y -framerate 60 -i output/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 18 -preset slow \
            output/${{ env.OUTPUT_NAME }}.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: output/${{ env.OUTPUT_NAME }}.mp4
          retention-days: 7

      - name: Upload sample frames
        uses: actions/upload-artifact@v4
        with:
          name: sample-frames
          path: output/frame_*.png
          retention-days: 7
