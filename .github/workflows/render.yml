name: Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Install dependencies
        working-directory: remotion-video
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: remotion-video
        run: npm run typecheck

      - name: Render 1080p preview
        working-directory: remotion-video
        run: npx remotion render LaserShow-1080 out/laser-show-1080.mp4 --pixel-format=yuv420p --bitrate=10000k

      - name: Render 4K final
        working-directory: remotion-video
        run: npx remotion render LaserShow out/laser-show-4k.mp4 --pixel-format=yuv420p --bitrate=10000k

      - name: Upload 1080p
        uses: actions/upload-artifact@v4
        with:
          name: laser-show-1080
          path: remotion-video/out/laser-show-1080.mp4
          if-no-files-found: warn

      - name: Upload 4K
        uses: actions/upload-artifact@v4
        with:
          name: laser-show-4k
          path: remotion-video/out/laser-show-4k.mp4
          if-no-files-found: warn
