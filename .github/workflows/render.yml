name: Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition name to render"
        required: true
        type: choice
        default: "LaserShow"
        options:
          - LaserShow
          - LaserShow-1080
          - PurpleSandStorm
          - PurpleSandStorm-1080
          - LiquidChrome
          - LiquidChrome-1080
          - GoldGrid
          - GoldGrid-1080
          - GoldGridTight
          - GoldGridTight-1080
          - EtherealCrystal
          - EtherealCrystal-1080
      quality:
        description: "Quality preset"
        required: true
        type: choice
        default: "balanced"
        options:
          - draft
          - balanced
          - final
      concurrency:
        description: "Render concurrency (1-4)"
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSITION: ${{ inputs.composition || 'LaserShow' }}
      QUALITY: ${{ inputs.quality || 'balanced' }}
      CONCURRENCY: ${{ inputs.concurrency || '2' }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Chrome browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render
        run: |
          mkdir -p out
          # Target ~50MB: 15s->26M, 20s->20M, 16s->25M (lihat render-all.yml)
          case "$COMPOSITION" in
            *SandStorm*) BITRATE="20M" ;;
            *LaserShow*) BITRATE="26M" ;;
            *) BITRATE="25M" ;;
          esac
          echo "Rendering $COMPOSITION with video-bitrate $BITRATE (~50MB target)"
          npx remotion render "$COMPOSITION" "out/${COMPOSITION}.mp4" \
            --codec=h264 \
            --pixel-format=yuv420p \
            --video-bitrate="$BITRATE" \
            --concurrency=${CONCURRENCY} \
            --overwrite \
            --chromium-flags="--no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --log=verbose
          ls -lh "out/${COMPOSITION}.mp4"
          du -m "out/${COMPOSITION}.mp4"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}-${{ env.QUALITY }}
          path: out/${{ env.COMPOSITION }}.mp4
          if-no-files-found: warn
