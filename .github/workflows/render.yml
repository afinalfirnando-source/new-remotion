name: Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition name to render"
        required: true
        type: choice
        default: "LaserShow"
        options:
          - LaserShow
          - LaserShow-1080
          - PurpleSandStorm
          - PurpleSandStorm-1080
          - LiquidChrome
          - LiquidChrome-1080
      bitrate:
        description: "Bitrate (kbps)"
        required: true
        type: choice
        default: "10000"
        options:
          - "2000"
          - "5000"
          - "8000"
          - "10000"
          - "20000"
          - "30000"
          - "50000"
      concurrency:
        description: "Render concurrency (1-8)"
        required: true
        type: choice
        default: "4"
        options:
          - "1"
          - "2"
          - "4"
          - "8"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSITION: ${{ inputs.composition || 'LaserShow' }}
      BITRATE: ${{ inputs.bitrate || '10000' }}
      CONCURRENCY: ${{ inputs.concurrency || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render
        run: |
          mkdir -p out
          npx remotion render "$COMPOSITION" "out/${COMPOSITION}.mp4" \
            --pixel-format=yuv420p \
            --bitrate="${BITRATE}k" \
            --concurrency=${CONCURRENCY}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}-${{ env.BITRATE }}k
          path: out/${{ env.COMPOSITION }}.mp4
          if-no-files-found: warn
